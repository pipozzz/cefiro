name: Build & push Docker image

# Builds the production image from docker/Dockerfile and pushes it to this
# repo's GitHub Container Registry (ghcr.io/<owner>/cefiro). Uses the built-in
# GITHUB_TOKEN — no external registry secrets required.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc/deploy-only changes don't affect the image — skip the build for them.
    # (A commit that also touches code still builds; workflow_dispatch always runs.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The monorepo image is large; the default runner disk (~14GB free) fills
      # up mid-build. Reclaim ~20-30GB of preinstalled tooling we don't need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Compute version report build-arg
        id: ver
        run: |
          {
            echo "json<<VERSION_EOF"
            node tooling/monorepo/scripts/print-package-versions.mjs
            echo "VERSION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NORISH_VERSION_REPORT_JSON=${{ steps.ver.outputs.json }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ---------------------------------------------------------------------------
  # CD: roll the freshly-built image out to Nomad. Skipped until you opt in by
  # setting the repo variable DEPLOY_ENABLED=true and the secrets/vars below.
  #
  #   Variables (Settings → Secrets and variables → Actions → Variables):
  #     DEPLOY_ENABLED = "true"          # master switch for this job
  #     CEFIRO_DOMAIN  = "recipes.example.com"
  #   Secrets:
  #     NOMAD_ADDR   = "https://nomad.internal:4646"
  #     NOMAD_TOKEN  = "<nomad ACL token>"
  #     GHCR_TOKEN   = "<read:packages token>"  # omit if the package is public
  #
  # The runner must be able to reach NOMAD_ADDR. If Nomad is on a private
  # network, use a self-hosted runner (change runs-on) or the Tailscale step.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Nomad
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: nomad-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reach a private Nomad by joining your tailnet. Uncomment + set the
      # TS_OAUTH_* secrets (or use a self-hosted runner instead).
      # - name: Connect Tailscale
      #   uses: tailscale/github-action@v3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      #     tags: tag:ci

      - name: Install Nomad CLI
        env:
          NOMAD_VERSION: "1.9.7"
        run: |
          curl -fsSL -o /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin >/dev/null
          nomad version

      - name: Deploy job to Nomad
        env:
          NOMAD_ADDR:  ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          # For an mTLS API, also write NOMAD_CACERT / NOMAD_CLIENT_CERT /
          # NOMAD_CLIENT_KEY from secrets and export those paths here.
        run: |
          # Deploy the exact image just built (matches the metadata "sha-<short>"
          # tag). Use image_tag=latest instead for the floating main image.
          nomad job run \
            -var "image_tag=sha-${GITHUB_SHA::7}" \
            -var "domain=${{ vars.CEFIRO_DOMAIN }}" \
            -var "registry_password=${{ secrets.GHCR_TOKEN }}" \
            deploy/nomad/cefiro.nomad.hcl
