name: Build & push Docker image

# Builds the production image from docker/Dockerfile and pushes it to this
# repo's GitHub Container Registry (ghcr.io/<owner>/cefiro). Uses the built-in
# GITHUB_TOKEN — no external registry secrets required.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc/deploy-only changes don't affect the image — skip the build for them.
    # (A commit that also touches code still builds; workflow_dispatch always runs.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  # Never cancel an in-progress image build on a burst of merges: each push to
  # main must produce a deployable image (tagged by commit SHA), and `latest`
  # must advance to the newest commit. cancel-in-progress:true meant a rapid
  # series of merges left only the last build running — and if that was
  # interrupted too, no image was published at all. `false` queues builds so
  # they run one after another in merge order instead.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No disk-reclaim step: an ubuntu-latest runner has ~86GB free on a 145GB
      # disk, and a measured cold (no-cache) build of this image — deps install +
      # turbo build + mode=max cache export — uses ~20GB and finishes with ~66GB
      # to spare. The old "reclaim 20-30GB" step assumed a ~14GB disk that no
      # longer exists, so it just cost ~1-3.5 min for nothing. If a build ever
      # fails with "no space left", restore a reclaim step (parallel rm of
      # /usr/local/lib/android, /opt/hostedtoolcache/CodeQL, /usr/share/dotnet, …
      # + docker image prune). df is kept as a cheap canary.
      - name: Show disk space
        run: df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Compute version report build-arg
        id: ver
        run: |
          {
            echo "json<<VERSION_EOF"
            node tooling/monorepo/scripts/print-package-versions.mjs
            echo "VERSION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NORISH_VERSION_REPORT_JSON=${{ steps.ver.outputs.json }}
          cache-from: type=gha
          # mode=max caches every intermediate stage (deps install, turbo
          # build), not just the final image layers, so unchanged stages are
          # reused across builds — worth the larger cache for a multi-stage build.
          cache-to: type=gha,mode=max

  # Deployment is pull-based: the "nomploy" UI (nomploy.spertulo.sk) runs the
  # Cefiro service on Nomad and pulls ghcr.io/pipozzz/cefiro:latest. GitHub only
  # builds and publishes the image; it does not connect to Nomad directly.
  # deploy/nomad/cefiro.nomad.hcl documents the service to configure there.
