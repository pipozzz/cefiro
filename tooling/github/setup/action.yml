name: "Setup and install"
description: "Common setup steps for Actions"

inputs:
  install-filter:
    description: "Optional pnpm --filter selector to scope the install (e.g. '@norish/landing...'). Empty installs the whole workspace."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    # Persist turbo's local cache between runs so unchanged packages skip their
    # build/test/lint/typecheck entirely. Content-hashed by turbo, so the key
    # only needs to roll (newest restored via the prefix); a run saves its own
    # entry and older ones fall out by LRU. This is the single biggest CI
    # speedup — a PR touching a few packages replays the rest.
    - name: Cache turbo
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      env:
        SKIP_PARSER_API_INSTALL: "1"
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [ -n "$INSTALL_FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$INSTALL_FILTER"
        else
          pnpm install --frozen-lockfile
        fi
