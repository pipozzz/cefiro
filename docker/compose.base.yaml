services:
  # PostgreSQL Database — pgvector image so the `vector` extension (semantic
  # discovery themes, Phase B) is available. Production Postgres is host-managed;
  # it must likewise run a pgvector-capable image (e.g. pgvector/pgvector:pg18).
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: norish
      POSTGRES_DB: norish
    volumes:
      - norish_db_data:/var/lib/postgresql/data

  # Obscura renders recipe pages for URL imports. The image starts its CDP
  # server with stealth on and private-network protection intact, so it needs
  # no command of its own — see docker/obscura/README.md.
  obscura:
    image: norishapp/obscura:0.2.0-norish.1
    restart: unless-stopped

  # Redis for real-time events
  redis:
    image: redis:8.10.1
    restart: unless-stopped
    volumes:
      - norish_redis_data:/data

volumes:
  norish_db_data:
  norish_redis_data:
