# Cefiro deploy compose. Secrets (AUTH_URL, DATABASE_URL, MASTER_KEY, REDIS_URL)
# are read from the environment — set them in nomploy / the host, never inline
# here. Postgres and Redis both run externally (the app reaches them via
# DATABASE_URL and REDIS_URL), so no local db/redis service is defined.
services:
  norish:
    image: ghcr.io/pipozzz/cefiro:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - norish_data:/app/uploads
    environment:
      AUTH_URL: $AUTH_URL
      DATABASE_URL: $DATABASE_URL
      MASTER_KEY: $MASTER_KEY
      OBSCURA_ENDPOINT: ws://obscura:9222
      UPLOADS_DIR: /app/uploads
      REDIS_URL: $REDIS_URL
      # Serve HTTP only; background jobs run in the worker service below.
      CEFIRO_ROLE: web
    deploy:
      resources:
        limits:
          memory: 2g
  # Background worker: same image, processes the queues, CalDAV sync, video
  # transcode and the importer so heavy jobs never block request serving.
  # Shares the uploads volume (it writes imported/generated images) and needs
  # the same DB/Redis/MASTER_KEY. No published port — it serves no HTTP.
  worker:
    image: ghcr.io/pipozzz/cefiro:latest
    restart: always
    volumes:
      - norish_data:/app/uploads
    environment:
      AUTH_URL: $AUTH_URL
      DATABASE_URL: $DATABASE_URL
      MASTER_KEY: $MASTER_KEY
      OBSCURA_ENDPOINT: ws://obscura:9222
      UPLOADS_DIR: /app/uploads
      REDIS_URL: $REDIS_URL
      CEFIRO_ROLE: worker
    deploy:
      resources:
        limits:
          memory: 2g
  obscura:
    image: norishapp/obscura:0.2.0-norish.1
    restart: unless-stopped
volumes:
  norish_data:
