# Cefiro deploy compose. Secrets (AUTH_URL, DATABASE_URL, MASTER_KEY, REDIS_URL)
# are read from the environment — set them in nomploy / the host, never inline
# here. Postgres and Redis both run externally (the app reaches them via
# DATABASE_URL and REDIS_URL), so no local db/redis service is defined.
services:
  norish:
    image: ghcr.io/pipozzz/cefiro:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      AUTH_URL: $AUTH_URL
      DATABASE_URL: $DATABASE_URL
      MASTER_KEY: $MASTER_KEY
      OBSCURA_ENDPOINT: ws://obscura:9222
      UPLOADS_DIR: /app/uploads
      REDIS_URL: $REDIS_URL
      # Media storage. This deploy stores images/videos in S3 / Cloudflare R2
      # (STORAGE_DRIVER=s3 + the S3_* values below, set in the environment), so
      # no persistent volume is mounted. /app/uploads is only ephemeral scratch
      # (e.g. video-import temp). If you switch back to STORAGE_DRIVER=fs,
      # re-add a volume on /app/uploads or media won't survive a redeploy.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-}
      # Voyage AI embeddings for semantic discovery themes (Phase B). Optional —
      # unset means embeddings are skipped.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Serve HTTP only; background jobs run in the worker service below.
      CEFIRO_ROLE: web
    deploy:
      resources:
        limits:
          memory: 2g
  # Background worker: same image, processes the queues, CalDAV sync, video
  # transcode and the importer so heavy jobs never block request serving.
  # Shares the uploads volume (it writes imported/generated images) and needs
  # the same DB/Redis/MASTER_KEY. No published port — it serves no HTTP.
  worker:
    image: ghcr.io/pipozzz/cefiro:latest
    restart: always
    environment:
      AUTH_URL: $AUTH_URL
      DATABASE_URL: $DATABASE_URL
      MASTER_KEY: $MASTER_KEY
      OBSCURA_ENDPOINT: ws://obscura:9222
      UPLOADS_DIR: /app/uploads
      REDIS_URL: $REDIS_URL
      # Same media storage as the web service — the worker writes imported and
      # generated images, so it must point at the same store.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-}
      # The worker runs the embedding + clustering jobs, so it needs the key.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CEFIRO_ROLE: worker
    deploy:
      resources:
        limits:
          memory: 2g
  obscura:
    image: norishapp/obscura:0.2.0-norish.1
    restart: unless-stopped
